[project]
name = "permis-bateau-rag"
version = "0.1.0"
description = "Chatbot RAG permis bateau côtier & fluvial"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "voyageai>=0.2",
  "mistralai>=1.2",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pyright]
venvPath = "."
venv = ".venv"
