<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Permis Bateau — Assistant RAG</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --accent: #38bdf8;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      header h1 {
        font-size: 1.1rem;
        font-weight: 600;
      }
      header span {
        color: var(--muted);
        font-size: 0.85rem;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }
      .msg {
        max-width: 80%;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        font-size: 0.95rem;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .user {
        align-self: flex-end;
        background: var(--accent);
        color: #082f49;
      }
      .bot {
        align-self: flex-start;
        background: var(--card);
        border: 1px solid var(--border);
      }
      .sources {
        margin-top: 0.5rem;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .typing {
        color: var(--muted);
        font-style: italic;
      }
      form {
        border-top: 1px solid var(--border);
        padding: 1rem 1.5rem;
        display: flex;
        gap: 0.75rem;
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }
      input {
        flex: 1;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        color: var(--text);
        font-size: 0.95rem;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      button {
        background: var(--accent);
        color: #082f49;
        border: none;
        border-radius: 0.5rem;
        padding: 0.75rem 1.25rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .suggest {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding: 0 1.5rem;
        max-width: 760px;
        width: 100%;
        margin: 0 auto;
      }
      .suggest button {
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--border);
        font-size: 0.8rem;
        padding: 0.35rem 0.75rem;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>⚓ Permis Bateau</h1>
      <span>Assistant RAG — révision côté &amp; fluvial</span>
    </header>

    <div class="suggest">
      <button data-q="Que signifie une sonde soulignée sur une carte marine ?">
        Sonde soulignée
      </button>
      <button data-q="Quels sont les feux d'un voilier la nuit ?">
        Feux voilier
      </button>
      <button data-q="Que faire en cas d'homme à la mer ?">
        Homme à la mer
      </button>
      <button data-q="Quel est le canal de veille VHF obligatoire ?">
        Canal 16
      </button>
    </div>

    <main id="chat"></main>

    <form id="form">
      <input
        id="input"
        placeholder="Pose ta question sur le permis bateau…"
        autocomplete="off"
        required
      />
      <button type="submit">Envoyer</button>
    </form>

    <script>
      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");

      function addMsg(text, who, sources) {
        const div = document.createElement("div");
        div.className = "msg " + who;
        div.textContent = text;
        if (sources && sources.length) {
          const s = document.createElement("div");
          s.className = "sources";
          s.textContent =
            "📚 " + sources.map((x) => x.source.split("/").pop()).join(" · ");
          div.appendChild(s);
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      }

      async function ask(question) {
        input.value = "";
        addMsg(question, "user");
        const typing = addMsg("…", "bot");
        typing.classList.add("typing");
        const btn = form.querySelector("button");
        btn.disabled = true;
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, use_graph: true, top_k: 4 }),
          });
          if (!res.ok)
            throw new Error(
              "HTTP " +
                res.status +
                (res.status === 429 ? " (rate limit)" : ""),
            );
          const data = await res.json();
          typing.classList.remove("typing");
          typing.textContent = data.answer;
          if (data.sources && data.sources.length) {
            const s = document.createElement("div");
            s.className = "sources";
            s.textContent =
              "📚 " +
              data.sources.map((x) => x.source.split("/").pop()).join(" · ");
            typing.appendChild(s);
          }
          chat.scrollTop = chat.scrollHeight;
        } catch (e) {
          typing.classList.remove("typing");
          typing.textContent = "❌ Erreur : " + e.message;
        } finally {
          btn.disabled = false;
          input.focus();
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (input.value.trim()) ask(input.value.trim());
      });
      document
        .querySelectorAll(".suggest button")
        .forEach((b) => b.addEventListener("click", () => ask(b.dataset.q)));
      input.focus();
    </script>
  </body>
</html>
