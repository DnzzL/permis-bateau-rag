# Déploiement Dokploy — API permis bateau RAG
#
# Créer une application de type "Docker Compose" dans Dokploy pointant vers
# ce repo, puis coller dans l'onglet "Environment" du service `api` :
#   VOYAGE_API_KEY=...
#   MISTRAL_API_KEY=...
#   CORS_ORIGINS=https://ton-domaine.fr,https://ton-site.netlify.app
#   (optionnel) MISTRAL_MODEL, RATE_LIMIT_MAX, RATE_LIMIT_WINDOW
#
# La base DuckDB est COMMITÉE dans le repo et copiée dans l'image :
# déploiement immédiat, aucune étape manuelle. Pour servir une base fraîche
# (après rebuild du corpus), monte-la en volume :
#   volumes: - ./data:/data   +   PERMIS_DB_PATH=/data/permis.duckdb
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: permis-bateau-api
    ports:
      - "8000:8000"
    environment:
      # CORS neutre par défaut (développement local) — mets tes propres
      # origines via l'env Dokploy (ex. https://ton-site.netlify.app).
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
