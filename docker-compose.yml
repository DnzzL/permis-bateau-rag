# Déploiement Dokploy — API permis bateau RAG (front + API, single-origin)
#
# Créer une application de type "Docker Compose" dans Dokploy pointant vers
# ce repo, puis coller dans l'onglet "Environment" du service `api` :
#   VOYAGE_API_KEY=...
#   MISTRAL_API_KEY=...
#   (optionnel) MISTRAL_MODEL, RATE_LIMIT_MAX, RATE_LIMIT_WINDOW,
#               CORS_ORIGINS (seulement si un front externe appelle l'API)
#
# Le même process sert le front statique (web/) à / et l'API à /api/chat :
# un seul port (8000), pas de CORS nécessaire. La base DuckDB est COMMITÉE
# dans le repo et copiée dans l'image : déploiement immédiat, aucune étape
# manuelle. Pour servir une base fraîche (après rebuild du corpus), monte-la
# en volume :  volumes: - ./data:/data   +   PERMIS_DB_PATH=/data/permis.duckdb
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: permis-bateau-api
    ports:
      - "8000:8000"
    environment:
      # CORS neutre par défaut (inutile pour le front inclus — même origine).
      # Ne mettre des origines que si un front externe appelle l'API.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
      # Clés API — interpolées depuis l'onglet Environment Dokploy :
      # il faut les RÉFÉRENCER ici (${...}), sinon elles ne sont pas transmises
      # au conteneur. Les valeurs vivent dans l'UI Dokploy, jamais dans le repo.
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
